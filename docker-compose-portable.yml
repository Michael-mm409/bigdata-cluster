services:
  bigdata-workbench:
    build:
      context: ./bigdata-workbench
    container_name: bigdata-workbench
    restart: unless-stopped
    depends_on:
      - namenode
      - hive-metastore
    volumes:
      - .:/opt/spark-apps
    environment:
      - HADOOP_CONF_DIR=/opt/spark-apps/hadoop_config

  # --- COORDINATION ---
  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"

  # --- NOSQL (HBASE) ---
  hbase-master:
    image: bde2020/hbase-master:1.0.0-hbase1.2.6
    container_name: hbase-master
    restart: unless-stopped
    depends_on:
      - zookeeper
      - namenode
    ports:
      - "16010:16010"
    environment:
      - HBASE_CONF_hbase_rootdir=hdfs://namenode:9000/hbase
      - HBASE_CONF_hbase_zookeeper_quorum=zookeeper
      - HBASE_CONF_hbase_cluster_distributed=true
      - HBASE_CONF_hbase_zookeeper_property_clientPort=2181

  # --- SQL CATALOG (HIVE) ---
  hive-metastore-db:
    image: postgres:13
    container_name: hive-metastore-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=metastore_db
      - POSTGRES_USER=hive
      - POSTGRES_PASSWORD=hive

  hive-metastore:
    image: bde2020/hive:2.3.2
    container_name: hive-metastore
    restart: unless-stopped
    depends_on:
      - hive-metastore-db
    ports:
      - "9083:9083"
    environment:
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore_db

  # --- HADOOP STORAGE ---
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: unless-stopped
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=michael_cluster
      - ENSURE_NAMENODE_DIR=/hadoop/dfs/name
      - CORE_CONF_fs_defaultFS=hdfs://0.0.0.0:9000
    volumes:
      - namenode_data:/hadoop/dfs/name
      - .:/opt/cluster-workspace  # <--- Mounts your main folder
      - .:/opt/spark-apps
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # Automatically build the client configuration mapping directory
        mkdir -p /opt/cluster-workspace/hadoop_config

        # Inject the XML files directly into the shared mount
        echo '<?xml version="1.0"?><configuration><property><name>fs.defaultFS</name><value>hdfs://namenode:9000</value></property></configuration>' > /opt/cluster-workspace/hadoop_config/core-site.xml
        echo '<?xml version="1.0"?><configuration><property><name>dfs.replication</name><value>1</value></property></configuration>' > /opt/cluster-workspace/hadoop_config/hdfs-site.xml

        # Hand off control back to the image's original entrypoint handlers
        /entrypoint.sh /run.sh

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: unless-stopped
    depends_on:
      - namenode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - datanode_data:/hadoop/dfs/data

  # --- SPARK PROCESSING ---
  spark-master:
    image: mds-spark:3.12
    container_name: spark-master
    restart: unless-stopped
    ports:
      - "7077:7077"
      - "8085:8080"
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    volumes:
      - .:/opt/spark-apps
    command: ["/usr/local/lib/python3.12/site-packages/pyspark/bin/spark-class", "org.apache.spark.deploy.master.Master"]

  spark-worker:
    image: mds-spark:3.12
    container_name: spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    volumes:
      - .:/opt/spark-apps
    command: ["/usr/local/lib/python3.12/site-packages/pyspark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]

  # --- KAFKA STREAMING ---
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-master
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'controller,broker'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  namenode_data:
  datanode_data:
