networks:
  bigdata-net:
    driver: bridge

volumes:
  namenode_data:

services:
  # --- COURSE REQUIRED: POSTGRESQL RELATIONAL DATA TIER ---
  postgres:
    image: postgres:16
    container_name: course-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=csc6002
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - ${HOME}/Big-Data-Cluster/infra/postgres_data:/var/lib/postgresql/data
      - ${COURSE_WORKSPACE}:/course:ro
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    shm_size: 256mb
    command: postgres -c shared_buffers=512MB -c work_mem=64MB -c effective_cache_size=2GB
    networks:
      - bigdata-net

  # --- COURSE REQUIRED: MONGODB DATA TIER ---
  mongodb:
    image: mongo:7.0
    container_name: course-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ${HOME}/Big-Data-Cluster/infra/mongo_data:/data/db
    networks:
      - bigdata-net

  # --- COURSE ALIGNED: SPARK LAB PROCESSING ---
  spark-master:
    image: apache/spark:3.5.6
    container_name: spark-master
    restart: unless-stopped
    ports:
      - "8085:8080"
      - "7077:7077"
    environment:
      - SPARK_NO_DAEMONIZE=true
    networks:
      - bigdata-net
    volumes:
      - "${COURSE_WORKSPACE}:/course"
      - ./spark-conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
  
  spark-worker:
    image: apache/spark:3.5.6
    depends_on:
      - spark-master
    restart: unless-stopped
    environment:
      - SPARK_NO_DAEMONIZE=true
      # - SPARK_MODE=worker
      # - SPARK_MASTER_URL=spark://spark-master:7077
      # - SPARK_WORKER_CORES=8
      # - SPARK_WORKER_MEMORY=8g
    networks:
      - bigdata-net
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "8"
      - --memory
      - "8g"
      - spark://spark-master:7077
    volumes:
      - "${COURSE_WORKSPACE}:/course"
