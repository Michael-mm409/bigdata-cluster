networks:
  bigdata-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  namenode_data:
  datanode_data:
  hadoop_historyserver:

services:
  # --- COURSE REQUIRED: POSTGRESQL RELATIONAL DATA TIER ---
  postgres:
    image: postgres:16
    container_name: course-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=csc6002
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - ${HOME}/Big-Data-Cluster/infra/postgres_data:/var/lib/postgresql/data
      - ${COURSE_WORKSPACE}:/course:ro
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    shm_size: 256mb
    command: postgres -c shared_buffers=512MB -c work_mem=64MB -c effective_cache_size=2GB
    networks:
      - bigdata-net

  # --- COURSE REQUIRED: MONGODB DATA TIER ---
  mongodb:
    image: mongo:7.0
    container_name: course-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ${HOME}/Big-Data-Cluster/infra/mongo_data:/data/db
    networks:
      - bigdata-net

  # --- COURSE ALIGNED: SPARK LAB PROCESSING ---
  spark-master:
    image: apache/spark:3.5.6
    container_name: spark-master
    restart: unless-stopped
    ports:
      - "8085:8080"
      - "7077:7077"
    environment:
      - SPARK_NO_DAEMONIZE=true
    networks:
      - bigdata-net
    volumes:
      - "${COURSE_WORKSPACE}:/course"
      - ./spark-conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master

  spark-worker:
    image: apache/spark:3.5.6
    depends_on:
      - spark-master
    restart: unless-stopped
    environment:
      - SPARK_NO_DAEMONIZE=true
    networks:
      - bigdata-net
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "8"
      - --memory
      - "8g"
      - spark://spark-master:7077
    volumes:
      - "${COURSE_WORKSPACE}:/course"

  # ==============================================================================
  # OPTIONAL PROFILE: HADOOP / HDFS CLUSTER STACK
  # (Only starts when --profile hadoop is passed)
  # ==============================================================================

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: unless-stopped
    profiles:
      - hadoop
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=csc6002-hadoop
    env_file:
      - ./hadoop.env
    volumes:
      - namenode_data:/hadoop/dfs/name
      - "${COURSE_WORKSPACE}:/course"
    networks:
      - bigdata-net

  secondarynamenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: secondarynamenode
    restart: unless-stopped
    profiles:
      - hadoop
    depends_on:
      - namenode
    ports:
      - "9868:9868"
    env_file:
      - ./hadoop.env
    environment:
      - HDFS_CONF_dfs_namenode_secondary_http___address=secondarynamenode:9868
    command: ["/run.sh"]
    networks:
      - bigdata-net

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: unless-stopped
    profiles:
      - hadoop
    depends_on:
      - namenode
    ports:
      - "9864:9864"
    env_file:
      - ./hadoop.env
    volumes:
      - datanode_data:/hadoop/dfs/data
    networks:
      - bigdata-net

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    restart: unless-stopped
    profiles:
      - hadoop
    depends_on:
      - namenode
      - datanode
    ports:
      - "8088:8088"
    env_file:
      - ./hadoop.env
    networks:
      - bigdata-net

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    restart: unless-stopped
    profiles:
      - hadoop
    depends_on:
      - resourcemanager
    env_file:
      - ./hadoop.env
    networks:
      - bigdata-net

  historyserver:
    image: bde2020/hadoop-historyserver:2.0.0-hadoop3.2.1-java8
    container_name: historyserver
    restart: unless-stopped
    profiles:
      - hadoop
    depends_on:
      - namenode
      - datanode
    ports:
      - "8188:8188"
    environment:
      - HOME_DIR=/opt/hadoop-3.2.1
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop_historyserver:/hadoop/yarn/timeline
    networks:
      - bigdata-net
