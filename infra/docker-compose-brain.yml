version: '3.8'

networks:
  bigdata-net:
    external: true

volumes:
  namenode_data:

services:
  # --- COORDINATION ---
  zookeeper:
    image: zookeeper:3.8
    ports:
      - "2181:2181"
    networks:
      bigdata-net:
        aliases:
          - zookeeper # ◄ Allows hbase to find it just as 'zookeeper'
    deploy:
      placement:
        constraints: [node.role == manager]

  # --- NOSQL (HBASE) ---
  hbase-master:
    image: bde2020/hbase-master:1.0.0-hbase1.2.6
    environment:
      - HBASE_CONF_hbase_rootdir=hdfs://my-cluster-namenode:9000/hbase  # ◄ Fixed
      - HBASE_CONF_hbase_zookeeper_quorum=zookeeper
    ports:
      - "16010:16010" 
    networks:
      - bigdata-net
    deploy:
      placement:
        constraints: [node.role == manager]

  # --- SQL CATALOG (HIVE) ---
  hive-metastore-db:
    image: postgres:13
    environment:
      - POSTGRES_DB=metastore_db
      - POSTGRES_USER=hive
      - POSTGRES_PASSWORD=hive
    networks:
      - bigdata-net
    deploy:
      placement:
        constraints: [node.role == manager]

  hive-metastore:
    image: bde2020/hive:2.3.2
    environment:
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionURL=jdbc:postgresql://my-cluster-hive-metastore-db:5432/metastore_db # ◄ Fixed
    networks:
      - bigdata-net
    deploy:
      placement:
        constraints: [node.role == manager]

  # HADOOP NAMENODE (The brain of HDFS)
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    ports:
      - "9870:9870" 
      - "9000:9000" 
    environment:
      - CLUSTER_NAME=michael_cluster
      - ENSURE_NAMENODE_DIR=/hadoop/dfs/name
      - CORE_CONF_fs_defaultFS=hdfs://my-cluster-namenode:9000              # ◄ Fixed
    volumes:
      - namenode_data:/hadoop/dfs/name
    networks:
      bigdata-net:
        aliases:
          - namenode # ◄ Let's standard internal configs find it via shortcut
    deploy:
      resources:
        limits:
          memory: 2g
      placement:
        constraints: [node.role == manager]

  # YARN RESOURCE MANAGER (The brain of Hadoop processing)
  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    ports:
      - "8088:8088" 
    environment:
      - SERVICE_PRECONDITION=my-cluster-namenode:9870 # ◄ Fixed target to full Swarm service name
    networks:
      - bigdata-net
    deploy:
      resources:
        limits:
          memory: 2g
      placement:
        constraints: [node.role == manager]

  # SPARK MASTER (Migrated out of host mode to Overlay)
  spark-master:
    build:
        context: ../apps/spark-base-312
    image: mds-spark:3.12
    ports:
      - "7077:7077"
      - "8080:8080"
      - "6066:6066"
    environment:
      - SPARK_MASTER_HOST=my-cluster-spark-master # ◄ Fixed
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - SPARK_MASTER_OPTS=-Dspark.master.bindAddress=0.0.0.0 -Dspark.master.rest.enabled=true -Dspark.master.rest.port=6066
    volumes:
      - ..:/opt/spark-apps
    networks:
      bigdata-net:
        aliases:
          - spark-master
    command: ["/usr/local/lib/python3.12/site-packages/pyspark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    deploy:
      placement:
        constraints: [node.role == manager]

  # KAFKA BROKER & CONTROLLER (KRaft Mode)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092" 
      - "9093:9093" 
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'controller,broker'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://my-cluster-kafka:9092'     # ◄ Fixed
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
    networks:
      bigdata-net:
        aliases:
          - kafka
    deploy:
      resources:
        limits:
          memory: 2g
      placement:
        constraints: [node.role == manager]