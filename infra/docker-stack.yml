networks:
  bigdata-net:
    external: true

services:
  # --- BRAIN SERVICES (Deploys only on Mini PC) ---
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    networks:
      - bigdata-net
    environment:
      - CLUSTER_NAME=michael_cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000   # ◄ Pure container name!
    deploy:
      placement:
        constraints: [node.role == manager]          # ◄ Locks to Mini PC

  spark-master:
    image: mds-spark:3.12
    networks:
      - bigdata-net
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
    command: ["/usr/local/lib/python3.12/site-packages/pyspark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    deploy:
      placement:
        constraints: [node.role == manager]          # ◄ Locks to Mini PC

  # --- WORKER SERVICES (Deploys only on your Desktop) ---
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    networks:
      - bigdata-net
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000   # ◄ Resolves via Swarm DNS!
    deploy:
      placement:
        constraints: [node.role == worker]           # ◄ Locks to your Desktop

  spark-worker:
    image: mds-spark:3.12
    networks:
      - bigdata-net
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077    # ◄ Resolves via Swarm DNS!
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]                     # ◄ Native Swarm GPU allocation
      placement:
        constraints: [node.role == worker]           # ◄ Locks to your Desktop